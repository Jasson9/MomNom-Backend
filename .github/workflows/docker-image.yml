name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  
  build:

    runs-on: self-hosted

    steps:
    
    - uses: actions/checkout@v4
    - name: Copy Appsettings.json
      env: # Set the secret as an input
        APP_SETTINGS: ${{secrets.APPSETTINGS}}
      run: |
        echo -e "$APP_SETTINGS" > MomNom-Backend/appsettings.json
    - name: Build the Docker image
      run: docker build . --file MomNom-Backend/Dockerfile --tag momnom-backend:latest
      
    - name: Build Dockercompose and up
      run: |
            cd /var/lib/casaos/apps/yourprojectname
            docker compose build --no-cache
            docker compose up -d
        
