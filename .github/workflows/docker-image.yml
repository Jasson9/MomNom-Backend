name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  
  build:

    runs-on: self-hosted

    steps:
    - name: Copy Appsettings.json
    - shell: bash
      run: echo -e ${{secrets.APPSETTINGS}} > MomNom-Backend/appsettings.json
    
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file MomNom-Backend/Dockerfile --tag momnom-backend:latest

  deploy:

    runs-on: self-hosted
    
    steps:
    
    - name: Build Dockercompose and up
    - shell: bash
      run: |
        cd /var/lib/casaos/apps/yourprojectname
        docker compose build --no-cache
        docker compose up -d
